<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Link & Xem Trực Tiếp (Bất Chấp Chặn)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-wrap: wrap;
        }
        header h1 {
            color: white;
            font-size: 20px;
            margin-right: 10px;
            white-space: nowrap;
        }
        .input-group {
            display: flex;
            flex: 1;
            min-width: 250px;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-go {
            background-color: #3498db;
            color: white;
        }
        .btn-go:hover {
            background-color: #2980b9;
        }
        .btn-newtab {
            background-color: #27ae60;
            color: white;
        }
        .btn-newtab:hover {
            background-color: #2ecc71;
        }
        .proxy-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        .proxy-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .content {
            flex: 1;
            position: relative;
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .notice {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
            z-index: 10;
            border-bottom: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌐 Web Viewer Pro</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Nhập link website (ví dụ: google.com)">
            <button class="btn-go" onclick="loadWebsite()">Xem trang</button>
            <button class="btn-newtab" onclick="openInNewTab()">Mở tab mới</button>
        </div>
        <label class="proxy-toggle">
            <input type="checkbox" id="useProxy" checked>
            Bật chế độ vượt chặn (Proxy)
        </label>
    </header>

    <div class="content">
        <div class="notice" id="notice"></div>
        <iframe id="webFrame" src="about:blank" title="Website Viewer"></iframe>
    </div>

    <script>
        function formatUrl(url) {
            url = url.trim();
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            return url;
        }

        function loadWebsite() {
            let inputVal = document.getElementById('urlInput').value;
            if (!inputVal) {
                alert("Vui lòng nhập một đường link!");
                return;
            }

            let finalUrl = formatUrl(inputVal);
            let iframe = document.getElementById('webFrame');
            let notice = document.getElementById('notice');
            let useProxy = document.getElementById('useProxy').checked;

            document.getElementById('urlInput').value = finalUrl;

            if (useProxy) {
                // Dùng dịch vụ Proxy công khai allorigins để gỡ lệnh chặn X-Frame-Options
                let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(finalUrl);
                iframe.src = proxyUrl;
                
                notice.innerHTML = "⏳ Đang tải qua máy chủ trung gian (Proxy). Nếu trang trắng quá lâu, máy chủ proxy có thể đang quá tải. Bạn có thể tắt Proxy và dùng 'Mở tab mới'.";
                notice.style.display = 'block';
            } else {
                iframe.src = finalUrl;
                notice.innerHTML = "⚠️ Chế độ thường: Các trang lớn (Google, FB) sẽ chặn nhúng và hiện trắng. Hãy bật Proxy để xem, hoặc bấm Mở tab mới.";
                notice.style.display = 'block';
            }

            setTimeout(() => {
                notice.style.display = 'none';
            }, 7000);
        }

        function openInNewTab() {
            let inputVal = document.getElementById('urlInput').value;
            if (!inputVal) {
                alert("Vui lòng nhập một đường link!");
                return;
            }
            let finalUrl = formatUrl(inputVal);
            window.open(finalUrl, '_blank');
        }

        document.getElementById('urlInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                loadWebsite();
            }
        });
    </script>

</body>
</html>
