<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Link & Xem Trực Tiếp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            flex-wrap: wrap;
        }
        header h1 {
            color: white;
            font-size: 20px;
            margin-right: 20px;
            white-space: nowrap;
        }
        .input-group {
            display: flex;
            flex: 1;
            min-width: 250px;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-go {
            background-color: #3498db;
            color: white;
        }
        .btn-go:hover {
            background-color: #2980b9;
        }
        .btn-newtab {
            background-color: #27ae60;
            color: white;
        }
        .btn-newtab:hover {
            background-color: #2ecc71;
        }
        .content {
            flex: 1;
            position: relative;
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .notice {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            display: none;
            z-index: 10;
            border-bottom: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌐 Web Viewer</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Nhập link website (ví dụ: wikipedia.org)">
            <button class="btn-go" onclick="loadWebsite()">Xem trang</button>
            <button class="btn-newtab" onclick="openInNewTab()">Mở tab mới</button>
        </div>
    </header>

    <div class="content">
        <div class="notice" id="notice">
            ⚠️ Lưu ý: Một số trang web lớn (Google, Facebook, Youtube...) có chặn nhúng vì lý do bảo mật. Nếu màn hình trắng, bạn hãy bấm "Mở tab mới".
        </div>
        <iframe id="webFrame" src="about:blank" title="Website Viewer"></iframe>
    </div>

    <script>
        function formatUrl(url) {
            url = url.trim();
            // Nếu người dùng không nhập http:// hoặc https://, tự động thêm https://
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            return url;
        }

        function loadWebsite() {
            let inputVal = document.getElementById('urlInput').value;
            if (!inputVal) {
                alert("Vui lòng nhập một đường link!");
                return;
            }

            let finalUrl = formatUrl(inputVal);
            let iframe = document.getElementById('webFrame');
            let notice = document.getElementById('notice');

            // Cập nhật lại ô input cho chuẩn
            document.getElementById('urlInput').value = finalUrl;

            // Hiển thị thông báo
            notice.style.display = 'block';
            
            // Tự ẩn thông báo sau 5 giây
            setTimeout(() => {
                notice.style.display = 'none';
            }, 5000);

            // Tải web vào iframe
            iframe.src = finalUrl;
        }

        function openInNewTab() {
            let inputVal = document.getElementById('urlInput').value;
            if (!inputVal) {
                alert("Vui lòng nhập một đường link!");
                return;
            }
            let finalUrl = formatUrl(inputVal);
            window.open(finalUrl, '_blank');
        }

        // Cho phép nhấn Enter để tải trang
        document.getElementById('urlInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                loadWebsite();
            }
        });
    </script>

</body>
</html>
